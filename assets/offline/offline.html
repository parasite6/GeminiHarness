<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeminiHarness</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #131314;
        --fg: #e3e3e3;
        --muted: #9aa0a6;
        --btn: #8ab4f8;
        --btn-fg: #131314;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Google Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem 3rem;
        text-align: center;
        gap: 1.25rem;
      }
      img {
        width: min(220px, 55vw);
        height: auto;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      button {
        margin-top: 0.5rem;
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.4rem;
        background: var(--btn);
        color: var(--btn-fg);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
      button:active {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./network-error.png" alt="" width="220" height="252" />
      <h1>You're not connected to the internet</h1>
      <p>
        GeminiHarness needs a network connection to open Gemini. We'll keep
        trying automatically, or you can retry now.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
    </script>
  </body>
</html>
